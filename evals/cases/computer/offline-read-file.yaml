id: computer.offline-read-file
title: Read a file (scripted)
modes:
- offline
turn: When is the meeting in {work}\notes.txt?
files:
  notes.txt: 'Meeting with Priya on Friday at 3pm.

    Budget: 12,500 AED.

    TODO: send the deck.

    '
approvals: decline
script:
- calls:
  - name: read_file
    arguments:
      path: '{work}\notes.txt'
- calls:
  - name: finish
    arguments:
      outcome: verified_complete
      message: The meeting is on Friday at 3pm.
expect:
  outcome_in:
  - verified_complete
  message_contains_all:
  - friday
tags:
- simple
