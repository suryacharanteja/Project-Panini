[project]
name = "panini-live-conversation"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["panini*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE", "SIM"]
ignore = ["E501", "SIM102", "SIM105", "SIM108", "B905"]
