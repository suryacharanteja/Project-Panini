# PANINI sandbox computers (V2-11), adapted from OpenDots compose.computers.yml (MIT).
# OpenBot pinned to the revision reviewed for OpenDots. Build both images; only the supervisor runs directly.
# It creates one computer per persona, with separate named volumes for files and browser profiles.
# Start it with scripts/panini-sandbox.py (it supplies the tokens from PANINI's DPAPI secret store).
name: panini-sandbox
services:
  computer-image:
    profiles: [build-computers]
    image: panini-computer:b6932d3
    build:
      context: https://github.com/CopilotKit/OpenBot.git#b6932d31a8d6e7896c15139dfc27a6c6911deb27
      dockerfile: agent-computer/Dockerfile
    command: ['true']
  computer-supervisor:
    image: panini-supervisor:b6932d3-panini-auth
    build:
      context: .
      dockerfile: supervisor.Dockerfile
      additional_contexts:
        openbot: https://github.com/CopilotKit/OpenBot.git#b6932d31a8d6e7896c15139dfc27a6c6911deb27
    ports:
      - '127.0.0.1:4312:4300'
    environment:
      PORT: '4300'
      SUPERVISOR_TOKEN: ${PANINI_SANDBOX_SUPERVISOR_TOKEN:?Run scripts/panini-sandbox.py}
      COMPUTER_TOKEN: ${PANINI_SANDBOX_COMPUTER_TOKEN:?Run scripts/panini-sandbox.py}
      COMPUTER_NAMESPACE: ${PANINI_SANDBOX_NAMESPACE:-panini}
      COMPUTER_IMAGE: panini-computer:b6932d3
      COMPUTER_BROWSER_MODE: headless
      COMPUTER_NETWORK: ''
      COMPUTER_MEMORY_BYTES: ${PANINI_SANDBOX_MEMORY_BYTES:-2147483648}
      COMPUTER_RUNTIME: ${PANINI_SANDBOX_RUNTIME:-}
    volumes:
      - ${ENGINE_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - computer-control
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r = await fetch('http://localhost:4300/health'); const j = await r.json(); process.exit(r.ok && j.docker ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  computer-control:
    # PANINI reaches the supervisor through its loopback-only published port.
    driver: bridge
