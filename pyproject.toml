[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [
  "panini-core/voice/live-spoken-conversation",
  ".",
  "panini-core/capabilities/cli/src",
  "panini-core/capabilities/browser/runtime",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

