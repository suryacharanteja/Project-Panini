[project]
name = "panini"
version = "0.1.0"
description = "Local-first AI personal assistant with voice, avatar, and tool integration"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.6",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "silero-vad>=5.1",
]
llm = ["ollama>=0.4", "httpx>=0.27"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panini"]

# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TID", "RUF"]
ignore = ["E501"]

# ⚠️ SECURITY BOUNDARY — HLD §1.3, LLD Index §3.2
# core/ and api/ must never reach tools directly; only via security.ToolGateway.
# A failure here is a security regression, not a style issue.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"panini.tools.registry".msg = "core/ and api/ must not import ToolRegistry. Use security.ToolGateway (HLD §1.3)."
"panini.tools.registry.ToolRegistry".msg = "Use security.ToolGateway instead (HLD §1.3)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["A", "N", "TID"]
"src/panini/security/**" = []
"src/panini/tools/**" = ["TID251"]      # tools/ may import its own registry

# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# LLD Index §1.1 — strict typing on the security kernel
module = "panini.security.*"
strict = true
disallow_any_explicit = false

# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "security: negative tests asserting the system REFUSES an action",
    "live: requires real external accounts",
]

[tool.coverage.run]
source = ["src/panini"]

[tool.coverage.report]
# LLD 01 §quality bar — 100% branch coverage on the kernel's critical files
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
