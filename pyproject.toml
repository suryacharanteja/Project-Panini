[project]
name = "panini"
version = "0.1.0"
description = "Local-first AI personal assistant with voice, avatar, and tool integration"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "cryptography>=43.0",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.6",
    "openwakeword>=0.6",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "silero-vad>=5.1",
]
llm = ["ollama>=0.4", "httpx>=0.27"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panini"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = [
  "src",
  "panini-core/voice/live-spoken-conversation",
  ".",
  "panini-core/capabilities/cli/src",
  "panini-core/capabilities/browser/runtime",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# LLD Index - strict typing on the security kernel
module = "panini.security.*"
strict = true
disallow_any_explicit = false

[tool.coverage.run]
source = ["src/panini"]

[tool.coverage.report]
# LLD 01 - quality bar: 100% branch coverage on the kernel's critical files
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
